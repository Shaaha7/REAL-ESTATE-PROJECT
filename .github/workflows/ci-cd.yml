name: PropAI CI/CD
on:
  push: {branches: [main, develop]}
  pull_request: {branches: [main]}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pytest tests/ -v --cov=src --tb=short
        working-directory: backend
        env: {LLM_PROVIDER: gemini, GOOGLE_API_KEY: ""}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package.json}
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # No registry account is configured for this portfolio repo yet - build
      # push is opt-in once DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets exist,
      # so this job skips its push steps cleanly instead of failing red.
      - name: Check registry credentials
        id: creds
        run: echo "configured=${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.creds.outputs.configured == 'true'
        with: {username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}"}
      - uses: docker/build-push-action@v5
        if: steps.creds.outputs.configured == 'true'
        with: {context: ./backend, push: true, tags: "${{ secrets.DOCKERHUB_USERNAME }}/propai-backend:latest"}
      - uses: docker/build-push-action@v5
        if: steps.creds.outputs.configured == 'true'
        with: {context: ./frontend, push: true, tags: "${{ secrets.DOCKERHUB_USERNAME }}/propai-frontend:latest"}
